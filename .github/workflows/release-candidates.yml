name: encrypted release candidates

on:
  workflow_dispatch:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  native-candidate:
    if: github.repository == 'Anharmoniclabs/AnharmonicStudio'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-14
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg libegl1 libgl1 libopengl0 libxkbcommon0 libportaudio2 libsndfile1
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg portaudio openssl@3
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg innosetup --no-progress -y
          $media = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$media) { throw 'FFmpeg executable not found' }
          $media.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Locked Python runtime and packaging tools
        run: |
          uv sync --locked --group dev
          uv pip install -r requirements-build.txt
          uv run --no-sync python scripts/build_native.py
      - name: Native application regressions
        run: >-
          uv run --no-sync python -m pytest -q tests/test_native_dsp.py
          tests/test_audio_quality.py tests/test_project_persistence.py
          tests/test_release_runtime.py tests/test_vocal_workspace.py
          tests/test_track_recording.py tests/test_audio_storage.py
          tests/test_midi_devices.py tests/test_devices_ui.py
          tests/test_external_plugins.py tests/test_plugin_host.py
          tests/test_paced_session.py
          --junitxml=reports/release-tests.xml
      - name: Ten minute mixed-instrument session (no physical devices)
        run: >-
          uv run --no-sync python scripts/soak_production.py --seconds 600 --frames 512
          --max-p99-load 1.0 --max-late-fraction 0.05 --max-growth-mib 64
          --json reports/soak.json
      - name: Compile, relocate and test installer
        run: uv run --no-sync python scripts/build_release.py dist/${{ matrix.target }} --version 0.1.0-rc.1
      - name: Encrypt paid candidates before upload
        run: uv run --no-sync python scripts/seal_release.py dist/${{ matrix.target }} sealed/${{ matrix.target }}.enc
      - name: Upload only encrypted binaries
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-${{ matrix.target }}
          path: sealed/${{ matrix.target }}.enc
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Test and stress reports (no installers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.target }}
          path: reports/
          retention-days: 14
