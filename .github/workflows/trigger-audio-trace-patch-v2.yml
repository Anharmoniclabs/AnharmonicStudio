name: Trigger audio trace patch v2

on:
  push:
    branches:
      - trigger/audio-trace-patch-v2-20260917

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wire-audio-event-trace-20260917
          fetch-depth: 0
      - name: Apply guarded patch
        run: |
          python scripts/_apply_audio_trace_patch.py
          rm -f scripts/_apply_audio_trace_patch.py
      - name: Compile patched sources
        run: python -m compileall -q mpclab/engine.py tests/test_engine_audio_trace.py
      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire audio event trace into Engine"
          git push origin HEAD:fix/wire-audio-event-trace-20260917
