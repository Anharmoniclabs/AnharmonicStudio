name: Apply hosted instrument persistence

on:
  push:
    branches:
      - finalize/realtime-foundations-20260917
    paths:
      - scripts/_apply_instrument_plugin_persistence.py
      - .github/workflows/apply-instrument-plugin-persistence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize/realtime-foundations-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply persistence patch
        run: python scripts/_apply_instrument_plugin_persistence.py
      - name: Format and validate
        run: |
          python -m pip install 'ruff==0.16.5'
          ruff format mpclab/plugin_registry.py mpclab/project_schema.py mpclab/model.py mpclab/instrument_plugin_state.py tests/test_instrument_plugin_state.py
          ruff check mpclab/plugin_registry.py mpclab/project_schema.py mpclab/model.py mpclab/instrument_plugin_state.py tests/test_instrument_plugin_state.py
          python -m compileall -q mpclab/plugin_registry.py mpclab/project_schema.py mpclab/model.py mpclab/instrument_plugin_state.py tests/test_instrument_plugin_state.py
          git diff --check
      - name: Commit clean persistence changes
        run: |
          rm -f scripts/_apply_instrument_plugin_persistence.py .github/workflows/apply-instrument-plugin-persistence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Persist hosted instruments by stable project identity'
          git push origin HEAD:finalize/realtime-foundations-20260917
