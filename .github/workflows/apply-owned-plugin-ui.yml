name: Apply owned plugin UI

on:
  push:
    branches:
      - finalize/realtime-foundations-20260917
    paths:
      - scripts/_apply_owned_plugin_ui.py
      - .github/workflows/apply-owned-plugin-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize/realtime-foundations-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply owned plugin UI patch
        run: python scripts/_apply_owned_plugin_ui.py
      - name: Format and validate
        run: |
          python -m pip install 'ruff==0.16.5'
          ruff format mpclab/ui/devices.py mpclab/workflow_plugin_pdc.py tests/test_devices_ui.py
          ruff check mpclab/ui/devices.py mpclab/workflow_plugin_pdc.py tests/test_devices_ui.py
          python -m compileall -q mpclab/ui/devices.py mpclab/workflow_plugin_pdc.py tests/test_devices_ui.py
          git diff --check
      - name: Commit clean UI changes
        run: |
          rm -f scripts/_apply_owned_plugin_ui.py .github/workflows/apply-owned-plugin-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Expose independently owned hosted instrument plugins'
          git push origin HEAD:finalize/realtime-foundations-20260917
