name: Final local DAW and Prism recovery

on:
  push:
    branches: [integration/local-handfx-recovery-20260915]
    paths: [.github/workflows/final-local-recovery.yml]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: integration/local-handfx-recovery-20260915
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.12'

      - name: Reconcile recovered DAW and Prism behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"{label}: expected source shape not found")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "mpclab/engine.py",
              '''        instrument_id: str | None = None,\n        midi_channel: int = 0,\n        midi_owner: str | None = None,\n    ) -> None:''',
              '''        instrument_id: str | None = None,\n        midi_channel: int = 0,\n        midi_owner: str | None = None,\n        event_source=None,\n        trigger_id=None,\n    ) -> None:''',
              "engine _spawn_synth signature",
          )
          replace_once(
              "mpclab/engine.py",
              '''            self.external.note_on(\n                note, velocity, offset, gate_frames, live_trigger, channel=midi_channel\n            )''',
              '''            self.external.note_on(\n                note,\n                velocity,\n                offset,\n                gate_frames,\n                live_trigger,\n                channel=midi_channel,\n                event_source=event_source,\n                trigger_id=trigger_id,\n            )''',
              "engine external synth routing",
          )
          replace_once(
              "mpclab/engine_mixing.py",
              '''        for event in notes:\n            beat, pad_idx, vel, _gate, sequence_id = event\n            off = int(max(0.0, (beat - b0) / bps))''',
              '''        for event in notes:\n            beat, pad_idx, vel, _gate, sequence_id = event\n            source = getattr(event, "source", None)\n            off = int(max(0.0, (beat - b0) / bps))''',
              "realtime event source",
          )
          replace_once(
              "mpclab/engine_mixing.py",
              '''                    instrument_id=instrument_id,\n                    midi_channel=getattr(event, "channel", 0),\n                )''',
              '''                    instrument_id=instrument_id,\n                    midi_channel=getattr(event, "channel", 0),\n                    event_source=source,\n                )''',
              "realtime synth ownership",
          )
          replace_once(
              "mpclab/engine_offline.py",
              '''from .music import automation_values\nfrom .instrument_state import decode_destination, voice_patch''',
              '''from .music import automation_values\nfrom .prism_motion import automation_parameters\nfrom .instrument_state import decode_destination, voice_patch''',
              "offline Prism import",
          )
          replace_once(
              "mpclab/engine_offline.py",
              '''                [(*event[:4], event[5]) for event in synth_events if event[4] is None],\n            )''',
              '''                [(*event[:4], event[5]) for event in synth_events if event[4] is None],\n                proj.bpm,\n            )''',
              "offline Prism tempo",
          )
          replace_once(
              "mpclab/engine_offline.py",
              '''                plugins.render_instrument(external_block, start, frames)''',
              '''                parameters = {}\n                if mode == "song" and plugins.instrument.info.get("name") == "Anharmonic Prism":\n                    parameters = automation_parameters(proj, start / (spb * engine.sr))\n                plugins.render_instrument(external_block, start, frames, parameters)''',
              "offline Prism automation",
          )

          synth_path = Path("mpclab/synth.py")
          merged = synth_path.read_text()
          baseline = subprocess.check_output(
              ["git", "show", "09cd01e6a333903a609745a24177a70f81df4a4c:mpclab/synth.py"],
              text=True,
          )
          render_marker = "    def render(self, dest: np.ndarray, patch: SynthPatch) -> None:\n"
          block_marker = "        sr = float(self.sample_rate)\n"
          end_marker = "\n\nclass ArpState:"
          merged_render = merged.index(render_marker)
          current_start = merged.index(block_marker, merged_render)
          current_end = merged.index(end_marker, current_start)
          base_render = baseline.index(render_marker)
          base_start = baseline.index(block_marker, base_render)
          base_end = baseline.index(end_marker, base_start)
          block = baseline[base_start:base_end]
          block = block.replace(
              "base = midi_to_hz(self.note)",
              "base = midi_to_hz(self.note + self.pitch_bend)",
          )
          block = block.replace(
              "pitch_mod = np.exp2(lfo * patch.lfo_pitch / 1200.0)",
              "pitch_mod = np.exp2(lfo * (patch.lfo_pitch + self.modulation * 40) / 1200.0)",
          )
          block = block.replace(
              '''                cutoff = patch.cutoff * math.exp2(\n                    patch.filter_env * self._half_envelope * 4.5\n                    + patch.lfo_filter * self._half_lfo * 3.0\n                )''',
              '''                cutoff = patch.cutoff * (1.0 + self.pressure) * math.exp2(\n                    patch.filter_env * self._half_envelope * 4.5\n                    + patch.lfo_filter * self._half_lfo * 3.0\n                )''',
          )
          block = block.replace(
              "        gain = env * min(1.0, max(0.0, self.velocity)) * max(0.0, patch.volume)",
              '''        gain = (\n            env\n            * min(1.0, max(0.0, self.velocity))\n            * max(0.0, patch.volume)\n            * self.expression_gain\n        )''',
          )
          synth_path.write_text(merged[:current_start] + block + merged[current_end:])

          track = Path("mpclab/ui/track_recording.py")
          text = track.read_text()
          text = text.replace(
              "import math\nimport numpy as np\n\nimport numpy as np\n",
              "import math\n\nimport numpy as np\n",
              1,
          )
          if "        self._live_monitor = None\n" not in text:
              text = text.replace(
                  "        self._capture_sample_rate = None\n",
                  "        self._capture_sample_rate = None\n        self._live_monitor = None\n",
                  1,
              )
          old = '''                self.recorder.sample_rate = app.engine.sr\n                self.recorder.blocksize = app.engine.blocksize\n                from ..autotune.live import LiveMonitor, MonitorRoute\n\n                route = MonitorRoute(self.recorder, app.engine, self.settings.monitor_gain)\n                # Start dry capture first, then initialize using its negotiated rate.\n                self.recorder.start(\n                    device, self.settings.input_gain_db, route if self.settings.monitor else None\n                )\n                self.recorder.input_channels = tuple(self.settings.input_channels)\n                self.recorder.start(device, self.settings.input_gain_db, monitor)'''
          new = '''                self.recorder.sample_rate = app.engine.sr\n                self.recorder.blocksize = app.engine.blocksize\n                self.recorder.input_channels = tuple(self.settings.input_channels)\n                from ..autotune.live import LiveMonitor, MonitorRoute\n\n                route = MonitorRoute(self.recorder, app.engine, self.settings.monitor_gain)\n                self.recorder.start(\n                    device, self.settings.input_gain_db, route if self.settings.monitor else None\n                )\n                if self.settings.monitor and self.settings.corrected_monitor:\n                    try:\n                        self._live_monitor = LiveMonitor(\n                            self.project.vocal, self.recorder.sample_rate, route\n                        )\n                        self.recorder.monitor_callback = self._live_monitor.push\n                    except Exception as exc:\n                        self._cue_error = f"Corrected cue unavailable; monitoring dry · {exc}"\n                self._capture_sample_rate = self.recorder.sample_rate'''
          if old not in text:
              raise SystemExit("track recorder start: expected source shape not found")
          text = text.replace(old, new, 1)
          finish = '''        if self.midi_take is not None:\n            completed = self.app.engine.midi.end_take()'''
          if finish not in text:
              raise SystemExit("track recorder MIDI finish shape not found")
          text = text.replace(
              finish,
              '''        if self._live_monitor is not None:\n            self._live_monitor.close()\n            self._live_monitor = None\n        if self.midi_take is not None:\n            completed = self.app.engine.midi.end_take()''',
              1,
          )
          old = '                    sources.append(app.library.add_audio(block, label, kind="recording"))'
          new = '''                    sources.append(\n                        app.library.add_audio(\n                            block,\n                            label,\n                            kind="recording",\n                            source_sample_rate=self._capture_sample_rate,\n                        )\n                    )'''
          if old not in text:
              raise SystemExit("multichannel library add shape not found")
          text = text.replace(old, new, 1)
          old = '''            row.clips.append(clip)\n            position = app.project.rows.index(row) + 1\n            app.project.rows[position:position] = additional_rows'''
          new = '''            row.clips.append(clip)\n            position = app.project.rows.index(row) + 1\n            app.project.rows[position:position] = additional_rows\n            if audio is not None:\n                app.engine.preload_project_audio()'''
          if old not in text:
              raise SystemExit("recording placement shape not found")
          text = text.replace(old, new, 1)
          discard = '''        self.unsaved = None\n        self.target = None\n        self.notes.clear()'''
          if discard not in text:
              raise SystemExit("discard take shape not found")
          text = text.replace(
              discard,
              '''        self.unsaved = None\n        self.midi_take = None\n        self.target = None\n        self.notes.clear()''',
              1,
          )
          track.write_text(text)
          PY

      - name: Resolve lockfile and install validation environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --python 3.12
          uv sync --locked --group dev

      - name: Format and static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff format mpclab tests scripts
          uv run --no-sync ruff check mpclab tests scripts
          uv run --no-sync python -m compileall -q mpclab scripts tests
          git diff --check

      - name: Targeted DAW, MIDI, scoring and Prism tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_engine_synth.py \
            tests/test_external_plugins.py \
            tests/test_midi_devices.py \
            tests/test_devices_ui.py \
            tests/test_recording_connectivity.py \
            tests/test_scoring.py \
            tests/test_transcription.py \
            tests/test_prism.py \
            tests/test_prism_camera.py

      - name: Commit and push repaired recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Anharmoniclabs recovery"
          git config user.email "132678602+Anharmoniclabs@users.noreply.github.com"
          git add mpclab tests scripts uv.lock
          git commit -m "Reconcile recovered DAW, MIDI, scoring and Prism behavior"
          git push origin HEAD:integration/local-handfx-recovery-20260915
