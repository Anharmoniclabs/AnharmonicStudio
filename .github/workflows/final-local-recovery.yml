name: Final local DAW and Prism recovery

on:
  push:
    branches: [integration/local-handfx-recovery-20260915]
    paths: [.github/workflows/final-local-recovery.yml]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    env:
      PATCH_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-0e2c-81f5-979d-cdfaa423ff76/raw?se=2026-09-15T18%3A48%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=82c6c35c-bcf9-5c2c-87de-be2adf84422b&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T15%3A22%3A05Z&ske=2026-09-16T15%3A22%3A05Z&sks=b&skv=2026-02-06&sig=1p4qXZuF/WIQ8CTdRx2ZX2FjLylHSkQZ%2BSFCrX2qvkc%3D"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: integration/local-handfx-recovery-20260915

      - name: Apply exact local Prism and Hand FX patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$PATCH_URL" -o /tmp/prism-local-fixes.zip
          unzip -q /tmp/prism-local-fixes.zip -d /tmp/prism-local-fixes
          gunzip -c /tmp/prism-local-fixes/prism-local-fixes.patch.gz > /tmp/prism-local-fixes.patch
          git apply --3way --index /tmp/prism-local-fixes.patch || true
          actual="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' mpclab/engine_offline.py mpclab/external_dsp.py uv.lock | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected merge conflicts:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          # These three overlaps are reconciled in the next connector commit;
          # keep the current DAW side here so the rest of the exact Prism patch
          # can be safely landed without replacing the repository tree.
          git checkout --ours mpclab/engine_offline.py mpclab/external_dsp.py uv.lock
          git add -A
          git diff --cached --check

      - name: Commit and push staged Prism work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Anharmoniclabs recovery"
          git config user.email "132678602+Anharmoniclabs@users.noreply.github.com"
          git commit -m "Stage recovered local Prism Hand FX and gesture work"
          git push origin HEAD:integration/local-handfx-recovery-20260915
