name: Final local DAW and Prism recovery

on:
  push:
    branches: [integration/local-handfx-recovery-20260915]
    paths: [.github/workflows/final-local-recovery.yml]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: integration/local-handfx-recovery-20260915
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.12'

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libopengl0 libxkbcommon0

      - name: Reconcile recovered DAW and Prism behavior
        run: python scripts/reconcile_local_recovery.py

      - name: Resolve lockfile and install validation environment
        run: |
          uv lock --python 3.12
          uv sync --locked --group dev

      - name: Format and static checks
        run: |
          uv run --no-sync ruff format mpclab tests scripts
          uv run --no-sync ruff check mpclab tests scripts
          uv run --no-sync python -m compileall -q mpclab scripts tests
          git diff --check

      - name: Targeted DAW, MIDI, scoring and Prism tests
        run: |
          uv run --no-sync pytest -q \
            tests/test_engine_synth.py \
            tests/test_external_plugins.py \
            tests/test_midi_devices.py \
            tests/test_devices_ui.py \
            tests/test_recording_connectivity.py \
            tests/test_scoring.py \
            tests/test_transcription.py \
            tests/test_prism.py \
            tests/test_prism_camera.py

      - name: Commit and push repaired recovery
        run: |
          git config user.name "Anharmoniclabs recovery"
          git config user.email "132678602+Anharmoniclabs@users.noreply.github.com"
          git add mpclab tests scripts uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile recovered DAW, MIDI, scoring and Prism behavior"
          fi
          git push origin HEAD:integration/local-handfx-recovery-20260915
