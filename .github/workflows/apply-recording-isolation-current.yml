name: Apply current recording isolation repair

on:
  push:
    branches: [fix/recording-isolation-current-main-20260917]
    paths:
      - scripts/_apply_recording_isolation_current.py
      - .github/workflows/apply-recording-isolation-current.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/recording-isolation-current-main-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.12'
      - name: Install test dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config ffmpeg libegl1 libgl1 libopengl0 libxkbcommon0 libsndfile1 libportaudio2 portaudio19-dev libasound2-dev liblilv-dev
          uv sync --locked --group dev
      - name: Apply guarded repair
        run: uv run --no-sync python scripts/_apply_recording_isolation_current.py
      - name: Format and lint
        run: |
          uv run --no-sync ruff format mpclab/ui/vocal_recording.py mpclab/ui/vocal_layout.py mpclab/ui/vocals.py mpclab/ui/track_recording.py tests/test_track_recording.py tests/test_vocal_panel.py
          uv run --no-sync ruff check mpclab/ui/vocal_recording.py mpclab/ui/vocal_layout.py mpclab/ui/vocals.py mpclab/ui/track_recording.py tests/test_track_recording.py tests/test_vocal_panel.py
          uv run --no-sync python -m compileall -q mpclab/ui/vocal_recording.py mpclab/ui/vocal_layout.py mpclab/ui/vocals.py mpclab/ui/track_recording.py tests/test_track_recording.py tests/test_vocal_panel.py
          git diff --check
      - name: Run focused recording regressions
        run: >-
          uv run --no-sync pytest -q
          tests/test_track_recording.py::test_song_audio_capture_does_not_inherit_vocal_monitor
          tests/test_vocal_panel.py::test_vocal_input_channel_selector_owns_one_physical_channel
      - name: Commit production repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mpclab/ui/vocal_recording.py mpclab/ui/vocal_layout.py mpclab/ui/vocals.py mpclab/ui/track_recording.py tests/test_track_recording.py tests/test_vocal_panel.py
          git rm -f scripts/_apply_recording_isolation_current.py .github/workflows/apply-recording-isolation-current.yml
          git commit -m 'Isolate vocal and Song audio capture paths'
          git push origin HEAD:fix/recording-isolation-current-main-20260917
