name: Apply explicit pad retrigger policy

on:
  push:
    branches:
      - finalize/realtime-foundations-20260917
    paths:
      - scripts/_apply_retrigger_policy.py
      - .github/workflows/apply-retrigger-policy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize/realtime-foundations-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded retrigger patch
        run: python scripts/_apply_retrigger_policy.py
      - name: Format and validate patched Python
        run: |
          python -m pip install 'ruff==0.16.5'
          ruff format mpclab/model.py mpclab/engine.py mpclab/audio_trace.py mpclab/ui/padgrid.py tests/test_pad_retrigger_policy.py
          ruff check mpclab/model.py mpclab/engine.py mpclab/audio_trace.py mpclab/ui/padgrid.py tests/test_pad_retrigger_policy.py
          python -m compileall -q mpclab/model.py mpclab/engine.py mpclab/audio_trace.py mpclab/ui/padgrid.py tests/test_pad_retrigger_policy.py
          git diff --check
      - name: Commit clean production tree
        run: |
          rm -f scripts/_apply_retrigger_policy.py .github/workflows/apply-retrigger-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add explicit pad retrigger policies'
          git push origin HEAD:finalize/realtime-foundations-20260917
