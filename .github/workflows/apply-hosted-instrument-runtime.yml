name: Apply hosted instrument runtime

on:
  push:
    branches:
      - finalize/realtime-foundations-20260917
    paths:
      - scripts/_apply_hosted_instrument_runtime.py
      - .github/workflows/apply-hosted-instrument-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize/realtime-foundations-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime patch
        run: python scripts/_apply_hosted_instrument_runtime.py
      - name: Format and validate
        run: |
          python -m pip install 'ruff==0.16.5'
          ruff format mpclab/external_dsp.py mpclab/engine.py mpclab/midi_performance.py mpclab/event_source.py mpclab/engine_mixing.py mpclab/workflow_routing.py mpclab/plugin_latency.py tests/test_hosted_instrument_runtime.py
          ruff check mpclab/external_dsp.py mpclab/engine.py mpclab/midi_performance.py mpclab/event_source.py mpclab/engine_mixing.py mpclab/workflow_routing.py mpclab/plugin_latency.py tests/test_hosted_instrument_runtime.py
          python -m compileall -q mpclab tests/test_hosted_instrument_runtime.py
          git diff --check
      - name: Commit clean runtime changes
        run: |
          rm -f scripts/_apply_hosted_instrument_runtime.py .github/workflows/apply-hosted-instrument-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Route hosted instruments by stable identity'
          git push origin HEAD:finalize/realtime-foundations-20260917
