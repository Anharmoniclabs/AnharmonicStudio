name: Apply DAW expansion integration

on:
  push:
    branches: [finalize/daw-expansion-implementation-20260917]
    paths:
      - scripts/_apply_expansion_mixer.py
      - scripts/_apply_expansion_mixer_v2.py
      - scripts/_apply_expansion_mixer_v3.py
      - scripts/_apply_expansion_mixer_v4.py
      - .github/workflows/apply-expansion-mixer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize/daw-expansion-implementation-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded realtime/offline patch
        run: python scripts/_apply_expansion_mixer_v4.py
      - name: Format and validate
        run: |
          python -m pip install 'ruff==0.16.5'
          ruff format mpclab/engine_mixing.py mpclab/engine_offline.py mpclab/expansion_instruments.py
          ruff check mpclab/engine_mixing.py mpclab/engine_offline.py mpclab/expansion_instruments.py
          python -m compileall -q mpclab/engine_mixing.py mpclab/engine_offline.py mpclab/expansion_instruments.py
          git diff --check
      - name: Commit production integration only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mpclab/engine_mixing.py mpclab/engine_offline.py mpclab/expansion_instruments.py
          git rm scripts/_apply_expansion_mixer.py scripts/_apply_expansion_mixer_v2.py scripts/_apply_expansion_mixer_v3.py scripts/_apply_expansion_mixer_v4.py .github/workflows/apply-expansion-mixer.yml
          git commit -m 'Integrate realtime and offline DAW expansion paths'
          git push origin HEAD:finalize/daw-expansion-implementation-20260917
