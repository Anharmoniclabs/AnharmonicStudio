name: Bounded vocal input isolation repair

on:
  push:
    branches: [fix/vocal-input-isolation-20260915]
    paths: [.github/workflows/fix-vocal-input-isolation-fast.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/vocal-input-isolation-20260915
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.12'
      - name: Install UI runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Apply the reviewed repair script
        shell: bash
        run: |
          set -euo pipefail
          awk '/python - <<'"'"'PY'"'"'/{flag=1; next} /^[[:space:]]*PY$/{if(flag){exit}} flag{sub(/^          /,""); print}' \
            .github/workflows/fix-vocal-input-isolation.yml > /tmp/vocal_repair.py
          test -s /tmp/vocal_repair.py
          python /tmp/vocal_repair.py
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Static validation
        run: |
          uv run --no-sync ruff format mpclab/ui/vocal_layout.py mpclab/ui/vocal_recording.py mpclab/ui/vocals.py mpclab/ui/track_recording.py
          uv run --no-sync ruff check mpclab/ui/vocal_layout.py mpclab/ui/vocal_recording.py mpclab/ui/vocals.py mpclab/ui/track_recording.py
          uv run --no-sync python -m compileall -q mpclab/ui
      - name: Focused recording regressions
        timeout-minutes: 3
        run: |
          uv run --no-sync pytest -q tests/test_vocal.py tests/test_recording_connectivity.py tests/test_midi_devices.py
      - name: Commit and push fix
        run: |
          git config user.name "Anharmoniclabs repair"
          git config user.email "132678602+Anharmoniclabs@users.noreply.github.com"
          git add mpclab/ui/vocal_layout.py mpclab/ui/vocal_recording.py mpclab/ui/vocals.py mpclab/ui/track_recording.py
          if ! git diff --cached --quiet; then
            git commit -m "Separate vocal, audio-input and MIDI capture paths"
            git push origin HEAD:fix/vocal-input-isolation-20260915
          fi
