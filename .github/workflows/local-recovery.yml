name: One-shot local recovery

on:
  push:
    branches: [integration/local-handfx-recovery-20260915]
    paths: [.github/workflows/local-recovery.yml]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: integration/local-handfx-recovery-20260915

      - name: Recover local DAW work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Anharmoniclabs recovery"
          git config user.email "132678602+Anharmoniclabs@users.noreply.github.com"
          git fetch --no-tags origin feature/daw-capability-foundations
          git cherry-pick -X theirs 7cc580086684d4d8a3192db0b8e364c945351cf4
          git cherry-pick -X theirs ed885c43cf90d96167e425707a8243e00551a3b1

      - name: Format recovered source without discarding local logic
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.16.5
          ruff format mpclab tests scripts
          python -m compileall -q mpclab tests scripts
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Format recovered local DAW changes"
          fi

      - name: Push recovered branch
        shell: bash
        run: git push origin HEAD:integration/local-handfx-recovery-20260915
