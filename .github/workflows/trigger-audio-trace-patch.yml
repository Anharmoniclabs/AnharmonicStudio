name: Trigger audio trace patch

on:
  push:
    branches:
      - trigger/audio-trace-patch-20260917

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wire-audio-event-trace-20260917
          fetch-depth: 0
      - name: Apply staged Engine patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-audio-trace-patch.yml').read_text()
          marker = '      - name: Wire bounded event trace into Engine\n'
          start = workflow.index(marker)
          run_marker = '        run: |\n'
          body_start = workflow.index(run_marker, start) + len(run_marker)
          body_end = workflow.index('      - name: Compile patched sources\n', body_start)
          lines = workflow[body_start:body_end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-audio-trace.sh').write_text(script)
          PY
          bash /tmp/apply-audio-trace.sh
          rm -f .github/workflows/trigger-audio-trace-patch.yml
      - name: Compile patched sources
        run: python -m compileall -q mpclab/engine.py tests/test_engine_audio_trace.py
      - name: Commit and push the real patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire audio event trace into Engine"
          git push origin HEAD:fix/wire-audio-event-trace-20260917
