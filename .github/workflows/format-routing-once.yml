name: Format Routing Tranche Once

on:
  push:
    branches:
      - feature/routing-and-pdc

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[autoformat]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/routing-and-pdc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.12'
      - name: Apply repository lint fixes and formatter
        run: |
          uv sync --locked --group dev
          uv run --no-sync ruff check --fix \
            mpclab/__main__.py \
            mpclab/engine_mixing.py \
            mpclab/engine_offline.py \
            mpclab/plugin_latency.py \
            mpclab/routing_ui.py \
            mpclab/workflow_mixing.py \
            mpclab/workflow_plugin_pdc.py \
            mpclab/workflow_routing.py \
            mpclab/workflow_state.py \
            tests/test_plugin_latency.py \
            tests/test_premium_workflows.py \
            tests/test_routing_audio_paths.py \
            tests/test_workflow_routing.py \
            tests/test_workflow_state.py
          uv run --no-sync ruff format \
            mpclab/__main__.py \
            mpclab/engine_mixing.py \
            mpclab/engine_offline.py \
            mpclab/plugin_latency.py \
            mpclab/routing_ui.py \
            mpclab/workflow_mixing.py \
            mpclab/workflow_plugin_pdc.py \
            mpclab/workflow_routing.py \
            mpclab/workflow_state.py \
            tests/test_plugin_latency.py \
            tests/test_premium_workflows.py \
            tests/test_routing_audio_paths.py \
            tests/test_workflow_routing.py \
            tests/test_workflow_state.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mpclab tests
          git commit -m 'Format routing and PDC tranche [autoformat]'
          git push origin HEAD:feature/routing-and-pdc
