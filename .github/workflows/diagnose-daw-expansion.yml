name: Diagnose DAW expansion tests

on:
  push:
    branches: [finalize/daw-expansion-implementation-20260917]
    paths:
      - .github/workflows/diagnose-daw-expansion.yml

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: finalize/daw-expansion-implementation-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.12'
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config ffmpeg libegl1 libgl1 libopengl0 libxkbcommon0 libsndfile1 libportaudio2 portaudio19-dev libasound2-dev liblilv-dev
      - name: Install Python dependencies
        run: uv sync --locked --group dev
      - name: Run focused suite and capture only failure report
        shell: bash
        run: |
          set +e
          uv run --no-sync python scripts/_certify_daw_expansion.py
          uv run --no-sync pytest -q --tb=short --maxfail=25 \
            tests/test_daw_expansion_core.py \
            tests/test_advanced_instruments.py \
            tests/test_sidechain_audio.py \
            tests/test_project_audio_expansion.py \
            tests/test_hosted_instrument_runtime.py \
            tests/test_devices_ui.py > expansion_test_failures.txt 2>&1
          status=$?
          echo "pytest_exit=$status" >> expansion_test_failures.txt
          tail -n 240 expansion_test_failures.txt > expansion_test_failures.tail
          mv expansion_test_failures.tail expansion_test_failures.txt
          exit 0
      - name: Publish diagnostic file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add expansion_test_failures.txt
          git commit -m 'Capture DAW expansion test failures'
          git push origin HEAD:finalize/daw-expansion-implementation-20260917
