name: Format audio trace on trigger

on:
  push:
    branches:
      - trigger/audio-trace-format-20260917

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trigger/audio-trace-format-20260917
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Format only the patched Python files
        run: |
          uvx ruff@0.16.5 format mpclab/engine.py tests/test_engine_audio_trace.py
          rm -f .github/workflows/format-audio-trace-on-trigger.yml
      - name: Commit the clean formatted tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format audio event trace wiring"
          git push origin HEAD:trigger/audio-trace-format-20260917
