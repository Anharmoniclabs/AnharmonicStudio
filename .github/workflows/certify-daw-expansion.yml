name: Certify DAW expansion

on:
  push:
    branches: [finalize/daw-expansion-implementation-20260917]
    paths:
      - scripts/_certify_daw_expansion.py
      - .github/workflows/certify-daw-expansion.yml

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: finalize/daw-expansion-implementation-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.12'
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config ffmpeg libegl1 libgl1 libopengl0 libxkbcommon0 libsndfile1 libportaudio2 portaudio19-dev libasound2-dev liblilv-dev
      - name: Install Python dependencies
        run: uv sync --locked --group dev
      - name: Apply final validation and focused fixes
        run: uv run --no-sync python scripts/_certify_daw_expansion.py
      - name: Format changed Python
        run: |
          mapfile -t FILES < <(git diff --name-only origin/main...HEAD -- '*.py'; git diff --name-only -- '*.py')
          mapfile -t FILES < <(printf '%s\n' "${FILES[@]}" | sort -u | grep -v '^scripts/_certify_daw_expansion.py$')
          test "${#FILES[@]}" -gt 0
          uv run --no-sync ruff format "${FILES[@]}"
          uv run --no-sync ruff check "${FILES[@]}"
          uv run --no-sync python -m compileall -q mpclab tests
          git diff --check
      - name: Run focused expansion tests
        run: >-
          uv run --no-sync pytest -q -o faulthandler_timeout=30
          tests/test_daw_expansion_core.py
          tests/test_advanced_instruments.py
          tests/test_sidechain_audio.py
          tests/test_project_audio_expansion.py
          tests/test_hosted_instrument_runtime.py
          tests/test_devices_ui.py
      - name: Commit certified production and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mpclab tests
          git rm -f scripts/_certify_daw_expansion.py .github/workflows/certify-daw-expansion.yml
          git rm -f .github/workflows/diagnose-daw-expansion.yml expansion_test_failures.txt || true
          git commit -m 'Certify DAW expansion 5 through 15'
          git push origin HEAD:finalize/daw-expansion-implementation-20260917
