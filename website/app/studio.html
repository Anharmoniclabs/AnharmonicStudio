<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191d">
  <title>Anharmonic Studio | Web Studio</title>
  <link rel="stylesheet" href="studio.css">
  <script src="project-model.js" defer></script>
  <script src="studio.js" defer></script>
</head>
<body>
  <header class="project-bar">
    <a href="../" class="logo" aria-label="Anharmonic Studio home">ANHARMONIC <small>STUDIO</small></a>
    <input class="project-name" value="Untitled project" aria-label="Project name">
    <div class="project-actions"><button id="undo-project" class="utility" disabled>Undo</button><button id="redo-project" class="utility" disabled>Redo</button><button id="save-project">Save</button><button id="load-project">Load</button><button id="export-wav">Export</button><button id="export-project" class="utility">JSON</button><button class="utility" id="theme-toggle">Light</button><button class="utility" id="accent-toggle">Color</button><button class="utility" id="typing-toggle">Keys</button><button class="utility" id="help-toggle">Help</button></div>
    <div class="meters"><span>L/R</span><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i><span class="meter-value">-12.4 dB</span></div>
  </header>
  <div class="transport-bar">
    <button class="transport play" id="play" aria-label="Play or pause">▶</button><button class="transport" id="stop" aria-label="Stop">■</button><button class="transport record" id="record" aria-label="Record microphone">●</button>
    <select id="playback-mode" aria-label="Playback scope"><option>Current pattern</option><option>Song timeline</option></select>
    <label class="compact-control">BPM <input id="tempo" type="number" value="110" min="40" max="240"></label><button id="tap-tempo" class="small-button">TAP</button>
    <label class="slider-control">SWING <input id="swing" type="range" min="0" max="70" value="0"><span id="swing-value">0%</span></label><button id="metronome" class="small-button">MET</button><button id="cut-source" class="small-button">CUT SOURCE</button>
    <output id="counter">001 . 1 . 00</output><label class="slider-control main-volume">MAIN <input id="master-volume" type="range" value="82"><span id="master-value">82%</span></label><span class="transport-spacer"></span><span class="audio-ready"><i></i> AUDIO READY</span>
  </div>
  <nav class="studio-nav" aria-label="Studio workspaces"><button data-workspace="song" class="active">Song</button><button data-workspace="beats">Beats</button><button data-workspace="notes">Notes</button><button data-workspace="sampler">Sampler</button><button data-workspace="instruments">Instruments</button><button data-workspace="autotune">Autotune</button><button data-workspace="mix">Mix</button><button class="tools">Tools ▾</button><span></span><button class="panel-toggle" data-toggle="browser">Browser</button><button class="panel-toggle" data-toggle="pads">Pads</button><button class="panel-toggle">Focus</button></nav>
  <main class="main-split">
    <aside class="browser-panel" id="browser-panel"><div class="panel-header"><strong>Browser</strong><button data-close="browser">×</button></div><div class="browser-actions"><button>CRATES</button><button id="stems-button">STEMS</button><button id="import-audio">+ FILE</button><button>+ PACK</button></div><div class="crate-shelf"><button><b>◈</b><span>Drums<small>12 sounds</small></span></button><button><b>∿</b><span>Instruments<small>24 sounds</small></span></button><button><b>◉</b><span>Vocals<small>8 sounds</small></span></button><button><b>✦</b><span>Favorites<small>0 sounds</small></span></button></div><div class="browser-heading"><strong>ALL SOUNDS</strong><span>44</span></div><input class="search" placeholder="Search your library" aria-label="Search library"><div class="filters"><button class="selected">All sounds</button><button>Project library</button><button>Sample packs</button></div><div class="sound-tree" id="sound-tree"><button class="sound selected"><span class="sound-icon">∿</span><span><strong>Drum break 01</strong><small>Drums · 128 BPM</small></span><em>▶</em></button><button class="sound"><span class="sound-icon">∿</span><span><strong>Midnight keys</strong><small>Instruments · C minor</small></span><em>▶</em></button><button class="sound"><span class="sound-icon">∿</span><span><strong>Room vocal chop</strong><small>Vocals · 94 BPM</small></span><em>▶</em></button><button class="sound"><span class="sound-icon">∿</span><span><strong>Sub pulse</strong><small>Bass · One shot</small></span><em>▶</em></button></div><div class="browser-footer">Drag a sound into Pads, Beats, Notes, or Song.<button id="use-sound">Use sound ▾</button></div></aside>
    <section class="stage" id="stage" aria-live="polite"></section>
    <aside class="pads-panel" id="pads-panel"><div class="panel-header"><strong>Pads</strong><span class="pad-bank"><button data-bank="0" class="active">A</button><button data-bank="1">B</button><button data-bank="2">C</button><button data-bank="3">D</button></span></div><div class="pad-grid" id="pad-grid"></div><div class="pad-inspector"><div class="inspector-title"><strong id="inspector-name">Pad 01 · Drum break 01</strong><button>⋮</button></div><div class="inspector-wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="inspector-row"><label>PITCH <output id="pitch-value">0 st</output><input id="pad-pitch" type="range" min="-24" max="24" value="0"></label><label>PAN <output id="pan-value">C</output><input id="pad-pan" type="range" min="-100" max="100" value="0"></label></div><div class="inspector-row"><label>GAIN <output id="gain-value">0 dB</output><input id="pad-gain" type="range" min="0" max="100" value="100"></label><label>MODE <select id="pad-mode"><option value="one-shot">One-shot</option><option value="gate">Gate</option><option value="loop">Loop</option></select></label></div><div class="inspector-dest">TRACK 01 <button id="assign-track">Assign to track ▾</button></div></div></aside>
  </main>
  <footer class="status-bar"><span id="status">ready</span><span>Project format v5 · Browser audio engine</span></footer>
  <input id="audio-file" type="file" accept="audio/*" hidden>
  <input id="project-file" type="file" accept="application/json,.json" hidden>
  <input id="accent-picker" type="color" value="#d6ab65" hidden>
</body>
</html>
